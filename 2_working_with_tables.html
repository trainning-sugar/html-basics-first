<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Using tables to organize data</title>
</head>
<body>
    <table border="1">
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>School</th>
        <th>Sign</th>
      </tr>
      <tr>
        <td>Alice</td>
        <td>30</td>
        <td>Lelphill academy</td>
        <td>Piscis</td>
      </tr>
      <tr>
        <td>Lulu</td>
        <td>40</td>
        <td>Lelphill academy</td>
        <td>Leo</td>
      </tr>
    </table>
</body>
</html>
