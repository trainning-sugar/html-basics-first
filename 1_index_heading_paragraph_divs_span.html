
<!--Declares the document as html5-->
<!DOCTYPE html>

<!--html root element-->
<html>
  <!--head include metadata such as the title-->
  <head>
    <!--Meta tags provide info to SEO and search engine-->
    <meta charset="UTF-8">
    <meta name="description" content="Learn HTML easily">
    <meta name="keywords" content="HTML, CSS, Javascript">
    <meta name="author" content="Lourdes Vilchez">
    <title>First Website</title>
  </head>
  <!--Body tag holds all visible content-->
  <body>
    <!--Heading, Paragraphs, divs and span -->
    <!--Header tags h1 to h6 -->
    <h1>First website</h1>
    <h2>Subtitle (h2)</h2>
    <h3>Section title (h3)</h3>
    <!-- p tag for description-->
    <p>This website is going to be cool</p>

    <div style="background-color: yellow; padding: 10px;">
      <h3>Div section</h3>
      <p>This is a block level container using "< div >" </p>
    </div>

    <p>
      this text container a 
      <span style="color: yellow; background-color: black;">Highlighted word </span>
      using "< span >" tag
    </p>
  </body>
</html>
