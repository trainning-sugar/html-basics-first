<!--Declares the document as HTML5-->
<!DOCTYPE html>
<!--Specifies that the content is in english-->
<html lang="en">
<!--Contains metadata like the title of the page-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semantic HTML</title>
</head>
<!--Holds the visible content of the webpage-->
<body>
  <header>
    <h1>My website</h1>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Blog</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section>
      <h2>About us</h2>
      <p>We build websites using clean HTML and CSS</p>
    </section>
    <article>
      <h2>Lastest Blog Post</h2>
      <p>Understanding the importance of semantic HTML.</p>
    </article>
    <aside>
      <h3>Sidebar</h3>
      <p>Links to useful resources</p>
    </aside>
  </main>
  <footer>
    <p>&copy; 2026 My website</p>
  </footer>
</body>
</html>
